services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-movienight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movienight}
      POSTGRES_DB: ${POSTGRES_DB:-movienight}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-movienight} -d ${POSTGRES_DB:-movienight}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      args:
        NEXT_PUBLIC_TMDB_API_KEY: ${NEXT_PUBLIC_TMDB_API_KEY:?NEXT_PUBLIC_TMDB_API_KEY is required}
    user: root
    working_dir: /app
    command: ["npx", "tsx", "src/db/migrate.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-movienight}:${POSTGRES_PASSWORD:-movienight}@db:5432/${POSTGRES_DB:-movienight}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_TMDB_API_KEY: ${NEXT_PUBLIC_TMDB_API_KEY:?NEXT_PUBLIC_TMDB_API_KEY is required}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-movienight}:${POSTGRES_PASSWORD:-movienight}@db:5432/${POSTGRES_DB:-movienight}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
